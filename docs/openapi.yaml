openapi: 3.0.0
info:
  title: Furan MVP API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /auth/register/student:
    post:
      summary: Register student
      responses:
        '201':
          description: Created
  /auth/register/business:
    post:
      summary: Register business
      responses:
        '201':
          description: Created
  /auth/login:
    post:
      summary: Log in
      responses:
        '200':
          description: OK
  /auth/logout:
    post:
      summary: Log out
      responses:
        '200':
          description: OK
  /auth/password-reset:
    post:
      summary: Request password reset
      responses:
        '200':
          description: OK
  /auth/password-reset/confirm:
    post:
      summary: Confirm password reset
      responses:
        '200':
          description: OK
  /students/me/profile:
    get:
      summary: Get student profile
      description: Returns the student profile for the authenticated student user. Returns 404 if profile has not been created yet.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/StudentProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or account suspended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update student profile
      description: Creates or updates the student profile for the authenticated student user. Preserves omitted fields on partial update, and clears explicitly null fields. Unknown fields are rejected with 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  profile:
                    $ref: '#/components/schemas/StudentProfile'
        '400':
          description: Invalid input or unknown fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or account suspended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /businesses/me/profile:
    get:
      summary: Get business profile
      description: Returns the business profile for the authenticated business user. Returns 404 if profile has not been created yet.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/BusinessProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or account suspended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update business profile
      description: Creates or updates the business profile for the authenticated business user. Requires valid company_name. Verification status defaults to PENDING and cannot be updated. Unknown fields are rejected with 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessProfileRequest'
      responses:
        '200':
          description: Company profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  profile:
                    $ref: '#/components/schemas/BusinessProfile'
        '400':
          description: Invalid input or unknown fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or account suspended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /opportunities:
    get:
      summary: List opportunities
      description: Returns a paginated list of opportunities. Supports filtering by type, skill, deadline, and keyword search (q). Returns expired and closed listings with status indicators.
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [INTERNSHIP, JOB, COMPETITION]
          description: Filter by opportunity type
        - in: query
          name: skill
          schema:
            type: string
          description: Filter by required skill
        - in: query
          name: deadline
          schema:
            type: string
          description: Filter by deadline date or datetime
        - in: query
          name: deadline_operator
          schema:
            type: string
            enum: [gte, lte]
            default: gte
          description: Operator for deadline filter (gte or lte)
        - in: query
          name: q
          schema:
            type: string
          description: Keyword search across title and description
        - in: query
          name: status
          schema:
            type: string
            enum: [OPEN, CLOSED]
          description: Optional filter by status
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Items per page
      responses:
        '200':
          description: List of opportunities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityListResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Post opportunity
      description: Allows an authenticated, verified business user to create a new opportunity listing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOpportunityRequest'
      responses:
        '201':
          description: Opportunity created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOpportunityResponse'
        '400':
          description: Invalid input or unknown fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied, missing profile, or pending/rejected verification)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /opportunities/{id}:
    get:
      summary: Get opportunity details
      description: Returns details of a specific opportunity by ID.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Opportunity unique identifier
      responses:
        '200':
          description: Opportunity details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityDetailResponse'
        '400':
          description: Invalid opportunity ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Opportunity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update opportunity
      description: Allows the owning business to edit an existing opportunity. Supports partial updates for type, title, description, skills_required, and deadline.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Opportunity unique identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOpportunityRequest'
      responses:
        '200':
          description: Opportunity updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOpportunityResponse'
        '400':
          description: Invalid input or unknown fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or not the owner business)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Opportunity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete opportunity
      description: Deletes an opportunity listing. Allowed for the owning business or a platform administrator. Restricted to opportunities with zero applications and zero competition registrations to protect the 12-month data retention policy.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Opportunity unique identifier
      responses:
        '204':
          description: Opportunity deleted successfully (No content)
        '400':
          description: Invalid opportunity ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or not the owner business)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Opportunity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (Cannot delete opportunity with existing applications or registrations)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /opportunities/{id}/close:
    post:
      summary: Close opportunity
      description: Closes an active opportunity. Only the business that originally posted the opportunity may close it. This operation is idempotent; closing an already closed opportunity succeeds without unintended changes.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Opportunity unique identifier
      responses:
        '200':
          description: Opportunity closed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseOpportunityResponse'
        '400':
          description: Invalid opportunity ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or not the owner business)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Opportunity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /opportunities/{id}/applications:
    post:
      summary: Apply to opportunity
      responses:
        '201':
          description: Created
    get:
      summary: Get applications for opportunity
      responses:
        '200':
          description: OK
  /students/me/applications:
    get:
      summary: Get my applications
      responses:
        '200':
          description: OK
  /applications/{id}/status:
    patch:
      summary: Update application status
      responses:
        '200':
          description: OK
  /opportunities/{id}/registrations:
    post:
      summary: Register for competition
      responses:
        '201':
          description: Created
    get:
      summary: Get registrations for competition
      responses:
        '200':
          description: OK
  /admin/businesses:
    get:
      summary: List pending businesses
      responses:
        '200':
          description: OK
  /admin/businesses/{id}/verification:
    patch:
      summary: Verify or reject business
      responses:
        '200':
          description: OK
  /admin/users:
    get:
      summary: List users
      responses:
        '200':
          description: OK
  /admin/users/{id}/status:
    patch:
      summary: Update user status
      responses:
        '200':
          description: OK
  /users/me:
    delete:
      summary: Delete my account
      responses:
        '204':
          description: No content
  /dashboard/summary:
    get:
      summary: Get dashboard summary
      responses:
        '200':
          description: OK
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    StudentProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        education:
          type: string
          nullable: true
        skills:
          type: array
          items:
            type: string
          nullable: true
        project_links:
          type: array
          items:
            type: string
            format: uri
          nullable: true
      required:
        - id
        - user_id
    UpdateStudentProfileRequest:
      type: object
      additionalProperties: false
      properties:
        education:
          type: string
          nullable: true
          maxLength: 191
        skills:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 30
          nullable: true
        project_links:
          type: array
          items:
            type: string
            format: uri
            maxLength: 255
          maxItems: 10
          nullable: true
    BusinessProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        company_name:
          type: string
        verification_status:
          type: string
          enum: [PENDING, VERIFIED, REJECTED]
      required:
        - id
        - user_id
        - company_name
        - verification_status
    UpdateBusinessProfileRequest:
      type: object
      additionalProperties: false
      required:
        - company_name
      properties:
        company_name:
          type: string
          minLength: 2
          maxLength: 191
    Opportunity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        posted_by:
          type: string
          format: uuid
        type:
          type: string
          enum: [INTERNSHIP, JOB, COMPETITION]
        title:
          type: string
        description:
          type: string
        skills_required:
          type: array
          items:
            type: string
          nullable: true
        deadline:
          type: string
          format: date-time
        status:
          type: string
          enum: [OPEN, CLOSED]
        is_expired:
          type: boolean
        effective_status:
          type: string
          enum: [OPEN, CLOSED, EXPIRED]
        company_name:
          type: string
          nullable: true
      required:
        - id
        - posted_by
        - type
        - title
        - description
        - deadline
        - status
        - is_expired
        - effective_status
    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean
        hasPrevPage:
          type: boolean
      required:
        - total
        - page
        - limit
        - totalPages
        - hasNextPage
        - hasPrevPage
    OpportunityListResponse:
      type: object
      properties:
        opportunities:
          type: array
          items:
            $ref: '#/components/schemas/Opportunity'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required:
        - opportunities
        - pagination
        - total
        - page
        - limit
        - totalPages
    OpportunityDetailResponse:
      type: object
      properties:
        opportunity:
          $ref: '#/components/schemas/Opportunity'
      required:
        - opportunity
    CreateOpportunityRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - description
        - deadline
      properties:
        type:
          type: string
          enum: [INTERNSHIP, JOB, COMPETITION]
        title:
          type: string
          minLength: 3
          maxLength: 191
        description:
          type: string
          minLength: 10
          maxLength: 10000
        skills_required:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 30
          nullable: true
        deadline:
          type: string
          format: date-time
    CreateOpportunityResponse:
      type: object
      required:
        - message
        - opportunity
      properties:
        message:
          type: string
        opportunity:
          $ref: '#/components/schemas/Opportunity'
    UpdateOpportunityRequest:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [INTERNSHIP, JOB, COMPETITION]
        title:
          type: string
          minLength: 3
          maxLength: 191
        description:
          type: string
          minLength: 10
          maxLength: 10000
        skills_required:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 30
          nullable: true
        deadline:
          type: string
          format: date-time
    UpdateOpportunityResponse:
      type: object
      required:
        - message
        - opportunity
      properties:
        message:
          type: string
        opportunity:
          $ref: '#/components/schemas/Opportunity'
    CloseOpportunityResponse:
      type: object
      required:
        - message
        - opportunity
      properties:
        message:
          type: string
        opportunity:
          $ref: '#/components/schemas/Opportunity'
