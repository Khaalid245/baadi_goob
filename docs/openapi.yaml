        - company_name
        - verification_status
        - user
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        company_name:
          type: string
        verification_status:
          type: string
          enum: [PENDING, VERIFIED, REJECTED]
        user:
          $ref: '#/components/schemas/AdminBusinessUser'
    AdminBusinessesListResponse:
      type: object
      required:
        - businesses
        - pagination
        - total
        - page
        - limit
        - totalPages
      properties:
        businesses:
          type: array
          items:
            $ref: '#/components/schemas/AdminBusinessDetails'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
    VerifyBusinessRequest:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum: [VERIFIED, REJECTED]
          description: Verification decision
        verification_status:
          type: string
          enum: [VERIFIED, REJECTED]
          description: Optional alias for status
        decision:
          type: string
          enum: [VERIFIED, REJECTED]
          description: Optional alias for status
    VerifyBusinessResponse:
      type: object
      required:
        - message
        - business
      properties:
        message:
          type: string
        business:
          $ref: '#/components/schemas/AdminBusinessDetails'
    AdminUser:
      type: object
      required:
        - id
        - name
        - email
        - role
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [STUDENT, BUSINESS, ADMIN]
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
        created_at:
          type: string
          format: date-time
    AdminUsersListResponse:
      type: object
      required:
        - users
