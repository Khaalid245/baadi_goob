        student_id:
          type: string
          description: Student User ID
        name:
          type: string
          description: Student name
        email:
          type: string
          format: email
          description: Student email
        education:
          type: string
          nullable: true
          description: Student education from profile
        skills:
          type: array
          items:
            type: string
          nullable: true
          description: Student skills from profile
        project_links:
          type: array
          items:
            type: string
          nullable: true
          description: Student project links from profile
        status:
          type: string
          enum: [NEW, SHORTLISTED, REJECTED, HIRED]
          description: Application status
        submitted_at:
          type: string
          format: date-time
          description: Application submission timestamp
    OpportunityApplicationsResponse:
      type: object
      required:
        - applications
      properties:
        applications:
          type: array
          items:
            $ref: '#/components/schemas/OpportunityApplicantItem'
        applicants:
          type: array
          items:
            $ref: '#/components/schemas/OpportunityApplicantItem'
    UpdateApplicationStatusRequest:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [SHORTLISTED, REJECTED, HIRED]
          description: New status for the application. Setting NEW is rejected with 400.
    UpdateApplicationStatusResponse:
      type: object
      required:
        - message
        - application
      properties:
        message:
          type: string
          example: Application status updated successfully
        application:
          $ref: '#/components/schemas/Application'
    CompetitionRegistration:
      type: object
      required:
        - id
        - student_id
        - opportunity_id
        - registered_at
      properties:
        id:
          type: string
          description: Registration unique identifier
        student_id:
          type: string
          description: ID of the registered student
        opportunity_id:
          type: string
          description: ID of the competition opportunity
        registered_at:
          type: string
          format: date-time
          description: Timestamp when the registration was created
    RegisterCompetitionResponse:
      type: object
      required:
        - message
        - registration
      properties:
        message:
          type: string
