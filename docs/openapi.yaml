          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [BUSINESS]
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
        created_at:
          type: string
          format: date-time
