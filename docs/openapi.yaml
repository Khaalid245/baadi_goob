openapi: 3.0.0
info:
  title: Furan MVP API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /auth/register/student:
    post:
      summary: Register student
      responses:
        '201':
          description: Created
  /auth/register/business:
    post:
      summary: Register business
      responses:
        '201':
          description: Created
  /auth/login:
    post:
      summary: Log in
      responses:
        '200':
          description: OK
  /auth/logout:
    post:
      summary: Log out
      responses:
        '200':
          description: OK
  /auth/password-reset:
    post:
      summary: Request password reset (FR-017)
      description: Initiates a single-use password reset workflow. Returns an identical generic success response whether or not the email exists to prevent account enumeration. A cryptographically secure random token is generated and its SHA-256 hash is persisted with a 15-minute expiration. Rate-limited to 5 requests per 15-minute window per IP in production.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Generic password reset response (anti-enumeration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
        '400':
          description: Invalid request body or email format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many password reset attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password-reset/confirm:
    post:
      summary: Confirm password reset (FR-017)
      description: Completes password reset by validating the supplied token against its stored SHA-256 hash. Rejects invalid, expired, or previously used tokens. Atomically invalidates the token and updates the user's password with a salted bcrypt hash. Suspended accounts are rejected with 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
        '400':
          description: Invalid or expired reset token, or invalid password format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account is suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /students/me/profile:
    get:
      summary: Get student profile
      description: Returns the student profile for the authenticated student user. Returns 404 if profile has not been created yet.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/StudentProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or account suspended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update student profile
      description: Creates or updates the student profile for the authenticated student user. Preserves omitted fields on partial update, and clears explicitly null fields. Unknown fields are rejected with 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  profile:
                    $ref: '#/components/schemas/StudentProfile'
        '400':
          description: Invalid input or unknown fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or account suspended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /businesses/me/profile:
    get:
      summary: Get business profile
      description: Returns the business profile for the authenticated business user. Returns 404 if profile has not been created yet.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/BusinessProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or account suspended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update business profile
      description: Creates or updates the business profile for the authenticated business user. Requires valid company_name. Verification status defaults to PENDING and cannot be updated. Unknown fields are rejected with 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessProfileRequest'
      responses:
        '200':
          description: Company profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  profile:
                    $ref: '#/components/schemas/BusinessProfile'
        '400':
          description: Invalid input or unknown fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or account suspended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /opportunities:
    get:
      summary: List opportunities
      description: Returns a paginated list of opportunities. Supports filtering by type, skill, deadline, and keyword search (q). Returns expired and closed listings with status indicators.
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [INTERNSHIP, JOB, COMPETITION]
          description: Filter by opportunity type
        - in: query
          name: skill
          schema:
            type: string
          description: Filter by required skill
        - in: query
          name: deadline
          schema:
            type: string
          description: Filter by deadline date or datetime
        - in: query
          name: deadline_operator
          schema:
            type: string
            enum: [gte, lte]
            default: gte
          description: Operator for deadline filter (gte or lte)
        - in: query
          name: q
          schema:
            type: string
          description: Keyword search across title and description
        - in: query
          name: status
          schema:
            type: string
            enum: [OPEN, CLOSED]
          description: Optional filter by status
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Items per page
      responses:
        '200':
          description: List of opportunities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityListResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Post opportunity
      description: Allows an authenticated, verified business user to create a new opportunity listing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOpportunityRequest'
      responses:
        '201':
          description: Opportunity created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOpportunityResponse'
        '400':
          description: Invalid input or unknown fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied, missing profile, or pending/rejected verification)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /opportunities/{id}:
    get:
      summary: Get opportunity details
      description: Returns details of a specific opportunity by ID.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Opportunity unique identifier
      responses:
        '200':
          description: Opportunity details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityDetailResponse'
        '400':
          description: Invalid opportunity ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Opportunity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update opportunity
      description: Allows the owning business to edit an existing opportunity. Supports partial updates for type, title, description, skills_required, and deadline.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Opportunity unique identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOpportunityRequest'
      responses:
        '200':
          description: Opportunity updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOpportunityResponse'
        '400':
          description: Invalid input or unknown fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or not the owner business)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Opportunity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete opportunity
      description: Deletes an opportunity listing. Allowed for the owning business or a platform administrator. Restricted to opportunities with zero applications and zero competition registrations to protect the 12-month data retention policy.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Opportunity unique identifier
      responses:
        '204':
          description: Opportunity deleted successfully (No content)
        '400':
          description: Invalid opportunity ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or not the owner business)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Opportunity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (Cannot delete opportunity with existing applications or registrations)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /opportunities/{id}/close:
    post:
      summary: Close opportunity
      description: Closes an active opportunity. Only the business that originally posted the opportunity may close it. This operation is idempotent; closing an already closed opportunity succeeds without unintended changes.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Opportunity unique identifier
      responses:
        '200':
          description: Opportunity closed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseOpportunityResponse'
        '400':
          description: Invalid opportunity ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or not the owner business)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Opportunity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /opportunities/{id}/applications:
    post:
      summary: Apply to opportunity
      description: Submits an application for the authenticated student using their saved profile. Requires a complete student profile with at least one skill. Only eligible for OPEN internship and job opportunities whose deadline has not passed. Prevents duplicate applications.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Opportunity unique identifier
      responses:
        '201':
          description: Application submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyOpportunityResponse'
        '400':
          description: Invalid opportunity ID, opportunity closed, deadline passed, or competition type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied, account suspended, or incomplete student profile)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Opportunity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (Already applied to this opportunity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Get applicants for opportunity
      description: Returns a list of applicants for the specified opportunity. Accessible only by the business that posted the opportunity (FR-009). Returns student profile information (name, email, education, skills, project links) and application details (id, status, submitted_at).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Opportunity unique identifier
      responses:
        '200':
          description: List of applicants for the opportunity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityApplicationsResponse'
        '400':
          description: Invalid opportunity ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied, not the owner business, or role is not business)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Opportunity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /opportunities/{id}/registrations:
    post:
      summary: Register for competition
      description: Allows an authenticated student to register for a listed competition (FR-006). Only eligible for OPEN competition opportunities whose deadline has not passed. Prevents duplicate registrations.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Competition opportunity unique identifier
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterCompetitionResponse'
        '400':
          description: Invalid opportunity ID, opportunity closed, deadline passed, or opportunity is not a competition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or role is not student)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Opportunity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (Already registered for this competition)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Get competition registrants
      description: Returns a list of students registered for the specified competition opportunity (FR-018). Accessible by the business that posted the competition or platform administrators (Section 5). Returns student profile information (name, email, education, skills, project links) and registration details (id, student_id, registered_at).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Competition opportunity unique identifier
      responses:
        '200':
          description: List of students registered for the competition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionRegistrationsResponse'
        '400':
          description: Invalid opportunity ID or opportunity is not a competition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied, not the owner business, or role is student)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Opportunity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /students/me/applications:
    get:
      summary: Get student applications
      description: Returns a list of all applications submitted by the authenticated student, ordered newest first. Includes related opportunity information (id, title, type, deadline, status, and company_name). Returns an empty array if the student has no applications.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of applications submitted by the authenticated student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentApplicationsResponse'
        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or account suspended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /applications/{id}/status:
    patch:
      summary: Update application status
      description: Allows a business to update the status of an applicant for an opportunity they own (FR-010). Permitted target statuses are SHORTLISTED, REJECTED, and HIRED (NEW is rejected). Atomically creates a notification for the student in the database (FR-014).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Application unique identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationStatusRequest'
      responses:
        '200':
          description: Application status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateApplicationStatusResponse'
        '400':
          description: Invalid application ID, invalid or unsupported status (including NEW), or unrecognized fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied, not the owner business, or role is not business)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /opportunities/{id}/registrations:
    post:
      summary: Register for competition
      responses:
        '201':
          description: Created
    get:
      summary: Get registrations for competition
      responses:
        '200':
          description: OK
  /admin/businesses:
    get:
      summary: List businesses for verification
      description: Returns a paginated list of businesses filtered by verification status (FR-012). Accessible to administrators only. Defaults to pending businesses.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, VERIFIED, REJECTED]
            default: PENDING
          description: Filter by business verification status (case-insensitive)
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of items per page
      responses:
        '200':
          description: Paginated list of businesses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBusinessesListResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or account suspended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/businesses/{id}/verification:
    patch:
      summary: Verify or reject a business account
      description: Allows an administrator to verify or reject a newly registered business account (FR-012, FR-019). Atomically creates an in-database notification for the business.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the business (Profile ID or User ID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyBusinessRequest'
      responses:
        '200':
          description: Business verification status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyBusinessResponse'
        '400':
          description: Invalid business ID, invalid verification decision, non-business account, or invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or account suspended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Business not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/users:
    get:
      summary: List all users
      description: Returns a paginated list of registered users filtered by role and status (FR-021). Accessible to administrators only. Excludes sensitive fields (passwords, tokens).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [STUDENT, BUSINESS, ADMIN]
          description: Filter users by role (case-insensitive)
        - in: query
          name: status
          schema:
            type: string
            enum: [ACTIVE, SUSPENDED]
          description: Filter users by status (case-insensitive)
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of items per page
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersListResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or account suspended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/users/{id}/status:
    patch:
      summary: Suspend or reactivate user account
      description: Allows an administrator to suspend or reactivate a user account (FR-021). Prevents self-suspension and rejects redundant status transitions.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: User status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserStatusResponse'
        '400':
          description: Invalid user ID, invalid status, redundant transition, or self-suspension attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or account suspended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/me:
    delete:
      summary: Delete my account
      responses:
        '204':
          description: No content
  /dashboard/summary:
    get:
      summary: Get dashboard summary
      responses:
        '200':
          description: OK
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    StudentProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        education:
          type: string
          nullable: true
        skills:
          type: array
          items:
            type: string
          nullable: true
        project_links:
          type: array
          items:
            type: string
            format: uri
          nullable: true
      required:
        - id
        - user_id
    UpdateStudentProfileRequest:
      type: object
      additionalProperties: false
      properties:
        education:
          type: string
          nullable: true
          maxLength: 191
        skills:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 30
          nullable: true
        project_links:
          type: array
          items:
            type: string
            format: uri
            maxLength: 255
          maxItems: 10
          nullable: true
    BusinessProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        company_name:
          type: string
        verification_status:
          type: string
          enum: [PENDING, VERIFIED, REJECTED]
      required:
        - id
        - user_id
        - company_name
        - verification_status
    UpdateBusinessProfileRequest:
      type: object
      additionalProperties: false
      required:
        - company_name
      properties:
        company_name:
          type: string
          minLength: 2
          maxLength: 191
    Opportunity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        posted_by:
          type: string
          format: uuid
        type:
          type: string
          enum: [INTERNSHIP, JOB, COMPETITION]
        title:
          type: string
        description:
          type: string
        skills_required:
          type: array
          items:
            type: string
          nullable: true
        deadline:
          type: string
          format: date-time
        status:
          type: string
          enum: [OPEN, CLOSED]
        is_expired:
          type: boolean
        effective_status:
          type: string
          enum: [OPEN, CLOSED, EXPIRED]
        company_name:
          type: string
          nullable: true
      required:
        - id
        - posted_by
        - type
        - title
        - description
        - deadline
        - status
        - is_expired
        - effective_status
    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean
        hasPrevPage:
          type: boolean
      required:
        - total
        - page
        - limit
        - totalPages
        - hasNextPage
        - hasPrevPage
    OpportunityListResponse:
      type: object
      properties:
        opportunities:
          type: array
          items:
            $ref: '#/components/schemas/Opportunity'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required:
        - opportunities
        - pagination
        - total
        - page
        - limit
        - totalPages
    OpportunityDetailResponse:
      type: object
      properties:
        opportunity:
          $ref: '#/components/schemas/Opportunity'
      required:
        - opportunity
    CreateOpportunityRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - description
        - deadline
      properties:
        type:
          type: string
          enum: [INTERNSHIP, JOB, COMPETITION]
        title:
          type: string
          minLength: 3
          maxLength: 191
        description:
          type: string
          minLength: 10
          maxLength: 10000
        skills_required:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 30
          nullable: true
        deadline:
          type: string
          format: date-time
    CreateOpportunityResponse:
      type: object
      required:
        - message
        - opportunity
      properties:
        message:
          type: string
        opportunity:
          $ref: '#/components/schemas/Opportunity'
    UpdateOpportunityRequest:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [INTERNSHIP, JOB, COMPETITION]
        title:
          type: string
          minLength: 3
          maxLength: 191
        description:
          type: string
          minLength: 10
          maxLength: 10000
        skills_required:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 30
          nullable: true
        deadline:
          type: string
          format: date-time
    UpdateOpportunityResponse:
      type: object
      required:
        - message
        - opportunity
      properties:
        message:
          type: string
        opportunity:
          $ref: '#/components/schemas/Opportunity'
    CloseOpportunityResponse:
      type: object
      required:
        - message
        - opportunity
      properties:
        message:
          type: string
        opportunity:
          $ref: '#/components/schemas/Opportunity'
    Application:
      type: object
      required:
        - id
        - student_id
        - opportunity_id
        - status
        - submitted_at
      properties:
        id:
          type: string
        student_id:
          type: string
        opportunity_id:
          type: string
        status:
          type: string
          enum: [NEW, SHORTLISTED, REJECTED, HIRED]
        submitted_at:
          type: string
          format: date-time
    ApplyOpportunityResponse:
      type: object
      required:
        - message
        - application
      properties:
        message:
          type: string
        application:
          $ref: '#/components/schemas/Application'
    StudentApplicationOpportunity:
      type: object
      required:
        - id
        - title
        - type
        - deadline
        - status
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [INTERNSHIP, JOB, COMPETITION]
        deadline:
          type: string
          format: date-time
        status:
          type: string
          enum: [OPEN, CLOSED]
        company_name:
          type: string
          nullable: true
    StudentApplicationItem:
      type: object
      required:
        - id
        - student_id
        - opportunity_id
        - status
        - submitted_at
        - opportunity
      properties:
        id:
          type: string
        student_id:
          type: string
        opportunity_id:
          type: string
        status:
          type: string
          enum: [NEW, SHORTLISTED, REJECTED, HIRED]
        submitted_at:
          type: string
          format: date-time
