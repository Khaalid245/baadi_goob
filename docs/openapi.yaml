openapi: 3.0.0
info:
  title: Furan MVP API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /auth/register/student:
    post:
      summary: Register student
      responses:
        '201':
          description: Created
  /auth/register/business:
    post:
      summary: Register business
      responses:
        '201':
          description: Created
  /auth/login:
    post:
      summary: Log in
      responses:
        '200':
          description: OK
  /auth/logout:
    post:
      summary: Log out
      responses:
        '200':
          description: OK
  /auth/password-reset:
    post:
      summary: Request password reset
      responses:
        '200':
          description: OK
  /auth/password-reset/confirm:
    post:
      summary: Confirm password reset
      responses:
        '200':
          description: OK
  /students/me/profile:
    get:
      summary: Get student profile
      description: Returns the student profile for the authenticated student user. Returns 404 if profile has not been created yet.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/StudentProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or account suspended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update student profile
      description: Creates or updates the student profile for the authenticated student user. Preserves omitted fields on partial update, and clears explicitly null fields. Unknown fields are rejected with 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  profile:
                    $ref: '#/components/schemas/StudentProfile'
        '400':
          description: Invalid input or unknown fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or account suspended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /businesses/me/profile:
    get:
      summary: Get business profile
      description: Returns the business profile for the authenticated business user. Returns 404 if profile has not been created yet.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/BusinessProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or account suspended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update business profile
      description: Creates or updates the business profile for the authenticated business user. Requires valid company_name. Verification status defaults to PENDING and cannot be updated. Unknown fields are rejected with 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessProfileRequest'
      responses:
        '200':
          description: Company profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  profile:
                    $ref: '#/components/schemas/BusinessProfile'
        '400':
          description: Invalid input or unknown fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Access denied or account suspended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /opportunities:
    get:
      summary: List opportunities
      responses:
        '200':
          description: OK
    post:
      summary: Post opportunity
      responses:
        '201':
          description: Created
  /opportunities/{id}:
    get:
      summary: Get opportunity details
      responses:
        '200':
          description: OK
    put:
      summary: Update opportunity
      responses:
        '200':
          description: OK
    delete:
      summary: Delete opportunity
      responses:
        '204':
          description: No content
  /opportunities/{id}/close:
    post:
      summary: Close opportunity
      responses:
        '200':
          description: OK
  /opportunities/{id}/applications:
    post:
      summary: Apply to opportunity
      responses:
        '201':
          description: Created
    get:
      summary: Get applications for opportunity
      responses:
        '200':
          description: OK
  /students/me/applications:
    get:
      summary: Get my applications
      responses:
        '200':
          description: OK
  /applications/{id}/status:
    patch:
      summary: Update application status
      responses:
        '200':
          description: OK
  /opportunities/{id}/registrations:
    post:
      summary: Register for competition
      responses:
        '201':
          description: Created
    get:
      summary: Get registrations for competition
      responses:
        '200':
          description: OK
  /admin/businesses:
    get:
      summary: List pending businesses
      responses:
        '200':
          description: OK
  /admin/businesses/{id}/verification:
    patch:
      summary: Verify or reject business
      responses:
        '200':
          description: OK
  /admin/users:
    get:
      summary: List users
      responses:
        '200':
          description: OK
  /admin/users/{id}/status:
    patch:
      summary: Update user status
      responses:
        '200':
          description: OK
  /users/me:
    delete:
      summary: Delete my account
      responses:
        '204':
          description: No content
  /dashboard/summary:
    get:
      summary: Get dashboard summary
      responses:
        '200':
          description: OK
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    StudentProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        education:
          type: string
          nullable: true
        skills:
          type: array
          items:
            type: string
          nullable: true
        project_links:
          type: array
          items:
            type: string
            format: uri
          nullable: true
      required:
        - id
        - user_id
    UpdateStudentProfileRequest:
      type: object
      additionalProperties: false
      properties:
        education:
          type: string
          nullable: true
          maxLength: 191
        skills:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 30
          nullable: true
        project_links:
          type: array
          items:
            type: string
            format: uri
            maxLength: 255
          maxItems: 10
          nullable: true
    BusinessProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        company_name:
          type: string
        verification_status:
          type: string
          enum: [PENDING, VERIFIED, REJECTED]
      required:
        - id
        - user_id
        - company_name
        - verification_status
    UpdateBusinessProfileRequest:
      type: object
      additionalProperties: false
      required:
        - company_name
      properties:
        company_name:
          type: string
          minLength: 2
          maxLength: 191
